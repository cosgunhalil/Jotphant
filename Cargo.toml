[package]
name = "Jotphant"
version = "0.1.0"
edition = "2024"

[lib]
name = "jotphant"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = "0.35.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
thiserror = "2.0.19"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
