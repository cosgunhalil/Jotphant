[package]
name = "Jotphant"
version = "0.1.0"
edition = "2024"

[lib]
name = "jotphant"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
eframe = "0.35.0"
egui_commonmark = "0.24.0"
notify-rust = "4.18.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
toml = "1.1.3"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
