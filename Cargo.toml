[package]
name = "Jotphant"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A warm desktop Pomodoro task board with a Markdown notebook"
repository = "https://github.com/cosgunhalil/Jotphant"

[lib]
name = "jotphant"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
eframe = "0.35.0"
egui_commonmark = "0.24.0"
notify-rust = "4.18.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
thiserror = "2.0.19"
toml = "1.1.3"

# Optimize release binaries for size and a single distributable exe.
[profile.release]
codegen-units = 1
lto = true
strip = true

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tempfile = "3.27.0"
